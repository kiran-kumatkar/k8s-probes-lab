apiVersion: v1
kind: Pod
metadata:
  name: startup-demo
spec:
  containers:
  - name: slow-app
    image: busybox
    args:
    - /bin/sh
    - -c
    - "sleep 40 && touch /tmp/started && sleep 300"
    startupProbe:
      exec:
        command:
        - cat
        - /tmp/started
      failureThreshold: 10
      periodSeconds: 5